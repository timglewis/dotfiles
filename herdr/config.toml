onboarding = false

[ui]
# Sidebar width auto-scales to fit workspace names, so the ceiling is raised
# alongside the default; otherwise the default is clamped back to 36.
sidebar_width = 36
sidebar_max_width = 48

[keys]
prefix = "ctrl+s"

# Floating lazygit over the current workspace; closes on exit, layout untouched.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# Pick a .vscode/launch.json config and run it in a throwaway pane.
# Plain letter rather than an alt chord so it works regardless of terminal.
# The pane inherits the source cwd, so lj finds the nearest launch.json.
[[keys.command]]
key = "prefix+d"
type = "pane"
command = "lj --hold"
